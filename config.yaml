# OPC AI Video Studio — 全局配置
# M3（你）相关字段：subtitle_agent / audio_agent / format_agent / paths.whisper_model
orchestrator:
  pipeline: [content_analysis, clip, subtitle, audio, thumbnail, social_media, format, quality]

clip_agent:
  max_clips: 3

subtitle_agent:
  whisper_model: base        # tiny/base/small；演示追求速度用 base 或 tiny
  target_languages: [en, zh]

audio_agent:
  target_languages: [en, zh]

social_media_agent:
  platforms: [douyin, xiaohongshu]

format_agent:
  platforms:
    tiktok: "9:16"
    youtube: "16:9"
    instagram: "1:1"

paths:
  input_dir: input
  output_dir: output

# 默认源语言（content_analyzer 可覆盖；中文素材改 "zh"）
source_language: en
