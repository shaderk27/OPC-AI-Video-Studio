# =============================================================================
# OPC AI Video Studio - Configuration
# One-Person Company AI Video Studio Project
# Based on the project by Prof. Yong Zhang, Shenzhen University
# =============================================================================

project:
  name: "OPC AI Video Studio"
  version: "1.0.0"
  description: "One Human + Multiple AI Agents = One-Person Video Studio"
  # Input: 10+ minute raw footage
  # Output: 15-60s polished short-form clips with subtitles, voiceover, captions

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:
  # Each processing run creates YYYY-MM-DD/HH-MM-SS_video-name_run-id
  # beneath this archive root. The remaining paths are runtime defaults.
  input_dir: "input"
  output_dir: "output"
  clips_dir: "output/clips"
  subtitles_dir: "output/subtitles"
  audio_dir: "output/audio"
  thumbnails_dir: "output/thumbnails"
  social_dir: "output/social"

# ─────────────────────────────────────────────────────────────────────────────
# Content Analyzer Agent Settings
# Pre-analyzes full video to provide intelligence for downstream agents
# Runs BEFORE the Clip Expert to enrich highlight detection
# ─────────────────────────────────────────────────────────────────────────────
content_analyzer:
  # Maximum number of topics to extract from the video
  max_topics: 8
  # Minimum duration (seconds) for a chapter to stand on its own
  chapter_min_duration: 30.0
  # Number of key moments to identify (top-N most impactful)
  key_moment_count: 10
  # Number of sentences in the generated summary
  summary_sentences: 3
  # Save the full analysis report as content_analysis.json
  save_report: true
  # Gemini analyzes timestamped transcript text only; the full video is not
  # uploaded. Its semantic output replaces shallow topics/chapters/key moments.
  gemini_analysis:
    enabled: true
    required: true
    model: "gemini-3.5-flash-lite"
    timeout_seconds: 120
    # Retry transient TLS resets, connection failures, timeouts, and retryable
    # HTTP responses. The total includes the original request.
    retry_attempts: 3
    # Fail quickly before full-video transcription if Gemini is unreachable.
    preflight_timeout_seconds: 10
    chunk_max_chars: 50000
    max_topics: 8
    max_key_moments: 12

# ─────────────────────────────────────────────────────────────────────────────
# Clip Expert Agent Settings
# Identifies highlights and cuts them into short clips
# Uses Content Analyzer data if available (avoids re-transcription)
# ─────────────────────────────────────────────────────────────────────────────
clip_agent:
  # Minimum and maximum clip duration in seconds
  min_clip_duration: 15
  max_clip_duration: 60
  # Target number of highlight clips to extract. The studio may return fewer
  # only when not enough candidates meet the minimum visual quality floor.
  max_clips: 5
  min_clips: 3
  # Highlight detection strategy:
  #   "transcript"  - Analyze transcript for key moments (keyword density, sentiment shifts, topic changes)
  #   "audio_energy" - Detect high-energy moments in audio (cheers, laughter, applause)
  #   "silence"     - Cut at silence boundaries for clean clip edges
  #   "combined"    - Use all strategies together (recommended)
  detection_strategy: "combined"
  # Keywords/patterns that indicate interesting content
  highlight_keywords:
    - "amazing"
    - "incredible"
    - "wow"
    - "look at this"
    - "important"
    - "key point"
    - "remember"
    - "secret"
    - "never seen"
    - "breakthrough"
  # Add padding (seconds) before and after detected highlights
  padding_before: 1.5
  padding_after: 1.0
  # Reserve time after a detected moment for its payoff and reaction
  # (for example: penalty buildup -> shot -> result/celebration)
  completion_padding_after: 6.0
  # Finish a nearby transcript sentence, but do not follow an unusually long
  # Whisper segment far beyond the protected payoff window
  transcript_boundary_max_extension: 2.0
  # Maximum score bonus when emotional language overlaps a strong audio peak
  emotion_audio_fusion_bonus: 15.0
  # Final selection balances content relevance with engagement potential
  topic_relevance_weight: 0.55
  hook_score_weight: 0.45
  topic_relevance_threshold: 60.0
  # Gemini reviews transcript/metadata candidates, then visually inspects
  # lightweight temporary video proxies before the final clips are cut.
  # If GEMINI_API_KEY is missing or a request fails, heuristic ranking is kept
  # unless `required` is true.
  gemini_review:
    enabled: true
    # When true, any missing key, SDK problem, timeout, API error, or invalid
    # response fails the Clip stage and the entire run instead of falling back.
    required: true
    model: "gemini-3.5-flash-lite"
    candidate_limit: 12
    blend_weight: 0.5
    timeout_seconds: 45
    retry_attempts: 3
    context_seconds: 5.0
    max_transcript_chars: 2400
    # Reject loud-only/weak candidates and refine start/end timestamps using
    # extra visual context around each proposed clip.
    video_review_enabled: true
    video_candidate_limit: 10
    video_context_seconds: 4.0
    video_min_score: 60
    # Borderline candidates above this score may fill empty target slots even
    # when Gemini's boolean accept decision varies between otherwise similar runs.
    video_backfill_min_score: 45
    video_blend_weight: 0.8
    video_processing_timeout_seconds: 180
  # Ensure clips start/end at silence boundaries for clean cuts
  snap_to_silence: true

# ─────────────────────────────────────────────────────────────────────────────
# Subtitle Expert Agent Settings
# Generates and translates subtitles for clips
# ─────────────────────────────────────────────────────────────────────────────
subtitle_agent:
  # Whisper model size: tiny, base, small, medium, large-v3
  # tiny  = fastest, least accurate  (~1GB RAM)
  # base  = good balance             (~1GB RAM)
  # small = better accuracy          (~2GB RAM)
  # medium = high accuracy           (~5GB RAM)
  # large-v3 = best accuracy         (~10GB RAM)
  whisper_model: "small"
  # Accuracy controls shared by Content Analyzer, Clip Expert and subtitles.
  beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 300
  # Names, teams, places or specialist terms Whisper should expect.
  # Example: ["Lionel Messi", "Ángel Di María", "Argentina", "France"]
  vocabulary_hints: []
  # If this model cannot be downloaded, a complete locally cached base model is
  # used automatically so the pipeline can continue.
  # Model downloads: huggingface.co is unreachable from mainland China, so the
  # studio automatically downloads via hf-mirror.com and caches the model under
  # models/whisper/. To override, set the HF_ENDPOINT environment variable,
  # or pre-download once with: python scripts/setup_whisper_model.py
  # Source language (auto-detect if null)
  source_language: null
  # Target languages for subtitle translation (ISO 639-1 codes)
  # Examples: en, zh, es, fr, de, ja, ko, ar, hi, pt, ru
  target_languages:
    - "en"
    - "zh"
  # Output formats
  formats:
    - "srt"
    - "vtt"
  # Maximum characters per subtitle line
  max_chars_per_line: 42
  # Maximum duration per subtitle (seconds)
  max_subtitle_duration: 7.0

# ─────────────────────────────────────────────────────────────────────────────
# Audio Expert Agent Settings
# Translates audio into target languages using TTS
# ─────────────────────────────────────────────────────────────────────────────
audio_agent:
  # TTS engine: "edge" (Microsoft Edge TTS — free, no key, works in mainland China)
  #             "gtts" (Google TTS — blocked on many CN networks)
  tts_engine: "edge"
  # Target languages for audio translation (ISO 639-1 codes)
  target_languages:
    - "en"
    - "zh"
  # Volume of original audio when mixing (0.0 = muted, 1.0 = full)
  original_audio_volume: 0.15
  # Volume of translated voiceover
  voiceover_volume: 1.0
  # Speed adjustment for TTS (1.0 = normal, 0.9 = slower, 1.1 = faster)
  tts_speed: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Enhancement: Thumbnail Agent
# Generates eye-catching thumbnails from clip highlights
# ─────────────────────────────────────────────────────────────────────────────
thumbnail_agent:
  # Thumbnail dimensions
  width: 1280
  height: 720
  # Number of thumbnail candidates per clip
  candidates_per_clip: 3
  # Add text overlay (clip title) to thumbnail
  add_text_overlay: true
  # Font size for overlay text
  font_size: 48

# ─────────────────────────────────────────────────────────────────────────────
# Enhancement: Social Media Agent
# Writes captions, hashtags, and descriptions for each platform
# ─────────────────────────────────────────────────────────────────────────────
social_media_agent:
  platforms:
    - name: "TikTok"
      max_caption_length: 150
      hashtag_count: 5
    - name: "YouTube Shorts"
      max_caption_length: 500
      hashtag_count: 10
    - name: "Instagram Reels"
      max_caption_length: 2200
      hashtag_count: 15
    - name: "X (Twitter)"
      max_caption_length: 280
      hashtag_count: 3
    - name: "Douyin"
      max_caption_length: 150
      hashtag_count: 5
    - name: "Xiaohongshu"
      max_caption_length: 1000
      hashtag_count: 8
  # Tone: casual, professional, energetic, educational
  tone: "energetic"

# ─────────────────────────────────────────────────────────────────────────────
# Enhancement: Quality Reviewer Agent
# Reviews clips for quality issues
# ─────────────────────────────────────────────────────────────────────────────
quality_agent:
  # Check for audio/video sync issues
  check_av_sync: true
  # Check subtitle timing alignment
  check_subtitle_sync: true
  # Check for silence gaps at clip boundaries
  check_silence_gaps: true
  # Minimum audio level (dB) - flag clips below this as too quiet
  min_audio_level: -30
  # Generate quality report
  generate_report: true

# ─────────────────────────────────────────────────────────────────────────────
# Enhancement: Format Adapter Agent
# Adapts clips for different social media platforms
# ─────────────────────────────────────────────────────────────────────────────
format_agent:
  # Output formats for different platforms
  # NOTE: platforms with the SAME width/height are rendered ONCE and share the
  # same file — e.g. TikTok, YouTube Shorts and Instagram Reels are all
  # 1080x1920, so only one vertical video is encoded and reused for all three.
  # Set `enabled: false` on any format you don't need to skip it entirely.
  formats:
    - platform: "TikTok"
      width: 1080
      height: 1920
      aspect_ratio: "9:16"
    - platform: "YouTube Shorts"
      width: 1080
      height: 1920
      aspect_ratio: "9:16"
    - platform: "Instagram Reels"
      width: 1080
      height: 1920
      aspect_ratio: "9:16"
    - platform: "YouTube"
      width: 1920
      height: 1080
      aspect_ratio: "16:9"
    - platform: "Instagram Feed"
      width: 1080
      height: 1080
      aspect_ratio: "1:1"
      # enabled: false   # <- example: uncomment to skip this format

# ─────────────────────────────────────────────────────────────────────────────
# Orchestrator Settings
# ─────────────────────────────────────────────────────────────────────────────
orchestrator:
  # Pipeline stages to run (in order)
  # Comment out stages to skip them
  pipeline:
    - "content_analysis"  # Pre-analyze video: topics, sentiment, chapters, key moments
    - "clip"          # Cut highlights from long video (uses analysis if available)
    - "subtitle"      # Generate and translate subtitles
    - "audio"         # Translate audio
    - "thumbnail"     # Generate thumbnails
    - "social_media"  # Write social media copy
    - "format"        # Adapt for different platforms
    - "quality"       # Review quality
  # Verbose logging
  verbose: true

# ─────────────────────────────────────────────────────────────────────────────
# Manager Agent Settings (Member 1 — System Architect)
# Supervisory orchestrator with retry logic + human-in-the-loop review gate
# ─────────────────────────────────────────────────────────────────────────────
manager_agent:
  # Maximum retry attempts per stage (0 = no retry, 1 = retry once)
  max_retries: 1
  # Timeout per stage in seconds (aborts if exceeded)
  stage_timeout: 300
  # Pause after Clip stage for human review of generated clips
  review_gate_enabled: true
  # Seconds before auto-approval. 0 means wait for an explicit human decision.
  review_gate_timeout: 0
  # Core stages — failure here stops the entire pipeline
  core_stages:
    - "content_analysis"
    - "clip"
    - "subtitle"
